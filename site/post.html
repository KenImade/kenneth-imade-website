<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing — Kenneth Imade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>a.link{color:var(--color-accent); text-decoration:underline; text-underline-offset:2px;} a.link:hover{color:var(--color-text);}</style>
</head>
<body>

  <nav class="nav" style="max-width:680px;">
    <a href="index.html" class="nav-name">Kenneth Imade</a>
    <a href="writing.html" style="font-family:var(--font-mono); font-size:12.5px; color:var(--color-text-softer);">&larr; back to writing</a>
  </nav>

  <div id="content"></div>

  <script src="content.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const slug = params.get('slug');
    const post = CONTENT.posts.find(p => p.slug === slug && p.paragraphs);
    const root = document.getElementById('content');

    if (!post) {
      root.innerHTML = `
        <div style="max-width:640px; margin:0 auto; padding:80px 24px; text-align:center;">
          <h1 style="font-family:var(--font-display); font-size:28px;">Post not found</h1>
          <p style="color:var(--color-text-soft);">This write-up doesn't exist yet.</p>
          <a href="writing.html" class="btn btn-dark" style="margin-top:16px;">Back to writing</a>
        </div>`;
    } else {
      root.innerHTML = `
        <header class="rise" style="max-width:640px; margin:0 auto; padding:60px 24px 40px;">
          <div style="font-family:var(--font-mono); font-size:12px; color:var(--color-accent); margin-bottom:16px; text-transform:uppercase; letter-spacing:0.05em;">${post.date}${post.readTime ? ' &middot; ' + post.readTime : ''}</div>
          <h1 style="font-family:var(--font-display); font-weight:600; font-size:40px; line-height:1.15; letter-spacing:-0.02em; margin:0 0 20px;">${post.title}</h1>
          <p style="font-size:18px; line-height:1.6; color:var(--color-text-soft); margin:0;">${post.subhead || post.blurb}</p>
        </header>

        <article style="max-width:640px; margin:0 auto; padding:20px 24px 30px;">
          <section style="margin-bottom:36px;">
            ${(post.paragraphs || []).map(p => `<p style="font-size:16.5px; line-height:1.8; color:var(--color-text-soft); margin:0 0 18px;">${p}</p>`).join('')}
          </section>
          ${(post.sections || []).map(sec => `
            <section style="margin-bottom:36px;">
              <h2 style="font-family:var(--font-display); font-size:22px; font-weight:600; margin:0 0 16px; letter-spacing:-0.01em;">${sec.heading}</h2>
              ${sec.paragraphs.map(p => `<p style="font-size:16.5px; line-height:1.8; color:var(--color-text-soft); margin:0 0 18px;">${p}</p>`).join('')}
            </section>`).join('')}
        </article>

        <footer style="max-width:640px; margin:0 auto; padding:50px 24px 70px; border-top:1px solid var(--color-border); margin-top:20px;">
          <a href="writing.html" class="btn btn-dark">&larr; More writing</a>
        </footer>`;
      document.title = post.title + ' — Kenneth Imade';
    }
  </script>
</body>
</html>
