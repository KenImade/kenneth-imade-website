<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kenneth Imade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="nav rise">
    <div class="nav-name">Kenneth Imade</div>
    <div class="nav-links">
      <a href="work.html">Work</a>
      <a href="writing.html">Writing</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <header style="max-width:var(--page-width); margin:0 auto; padding:90px 24px 70px;">
    <div class="rise" style="display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:12.5px; color:var(--color-status-text); margin-bottom:22px;">
      <span style="width:7px; height:7px; border-radius:50%; background:var(--color-status-dot); animation: blink 2s ease infinite;"></span>
      <span id="status-line"></span>
    </div>
    <h1 id="hero-headline" class="rise" style="font-family:var(--font-display); font-weight:600; font-size:56px; line-height:1.08; letter-spacing:-0.02em; margin:0 0 24px; max-width:780px;"></h1>
    <p id="hero-sub" class="rise" style="font-size:18px; line-height:1.6; color:var(--color-text-soft); max-width:560px; margin:0 0 34px;"></p>
    <div class="rise" style="display:flex; gap:14px; flex-wrap:wrap;">
      <a href="#work" class="btn btn-dark">See the work &rarr;</a>
      <a id="hero-email" href="#" class="btn btn-ghost">Say hi</a>
    </div>
    <div class="rise" style="display:flex; gap:20px; margin-top:34px;">
      <a id="social-github" href="#" target="_blank" rel="noopener" style="font-family:var(--font-mono); font-size:13px; color:var(--color-text-softer);">GitHub</a>
      <a id="social-linkedin" href="#" target="_blank" rel="noopener" style="font-family:var(--font-mono); font-size:13px; color:var(--color-text-softer);">LinkedIn</a>
      <a id="social-email" href="#" style="font-family:var(--font-mono); font-size:13px; color:var(--color-text-softer);">Email</a>
    </div>
  </header>

  <section id="work" style="max-width:var(--page-width); margin:0 auto; padding:40px 24px 90px; scroll-margin-top:24px;">
    <div class="section-head">
      <h2 style="font-family:var(--font-display); font-size:26px; font-weight:600; margin:0; letter-spacing:-0.01em;">Selected work</h2>
      <a href="work.html" style="font-family:var(--font-mono); font-size:12px; color:var(--color-accent);">see all &rarr;</a>
    </div>
    <div id="project-list"></div>
  </section>

  <section id="writing" style="max-width:var(--page-width); margin:0 auto; padding:0 24px 90px; scroll-margin-top:24px;">
    <div class="section-head">
      <h2 style="font-family:var(--font-display); font-size:26px; font-weight:600; margin:0; letter-spacing:-0.01em;">Writing</h2>
      <a href="writing.html" style="font-family:var(--font-mono); font-size:12px; color:var(--color-accent);">see all &rarr;</a>
    </div>
    <div id="post-list"></div>
  </section>

  <section id="about" style="max-width:var(--page-width); margin:0 auto; padding:0 24px 90px; scroll-margin-top:24px;">
    <div style="display:grid; grid-template-columns:1.1fr 0.9fr; gap:60px; border-top:1px solid var(--color-border); padding-top:44px;">
      <div>
        <h2 style="font-family:var(--font-display); font-size:26px; font-weight:600; margin:0 0 18px; letter-spacing:-0.01em;">About</h2>
        <div id="about-paragraphs"></div>
      </div>
      <div>
        <div style="font-family:var(--font-mono); font-size:12px; color:var(--color-text-softer); margin-bottom:14px; text-transform:uppercase; letter-spacing:0.05em;">Toolbox</div>
        <div id="skills-list" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
      </div>
    </div>
  </section>

  <footer id="contact" class="site-footer" style="scroll-margin-top:24px;">
    <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap;">
      <div>
        <h2 id="contact-headline" style="font-family:var(--font-display); font-size:26px; font-weight:600; margin:0 0 10px; letter-spacing:-0.01em;"></h2>
        <p id="contact-sub" style="font-size:15px; color:var(--color-text-soft); margin:0;"></p>
      </div>
      <div style="display:flex; gap:12px; flex-wrap:wrap;">
        <a id="contact-email" href="#" class="btn btn-dark">Email</a>
        <a id="contact-github" href="#" target="_blank" rel="noopener" class="btn btn-ghost">GitHub</a>
        <a id="contact-linkedin" href="#" target="_blank" rel="noopener" class="btn btn-ghost">LinkedIn</a>
      </div>
    </div>
    <div style="margin-top:50px; font-family:var(--font-mono); font-size:11.5px; color:var(--color-text-softest);">&copy; 2026 Kenneth Imade &mdash; built with more care than the average Friday deploy.</div>
  </footer>

  <script src="content.js"></script>
  <script src="render.js"></script>
  <script>
    const p = CONTENT.profile;
    document.getElementById('status-line').textContent = p.statusLine;
    document.getElementById('hero-headline').innerHTML = p.heroHeadline.join('<br>');
    document.getElementById('hero-sub').textContent = p.heroSub;
    document.getElementById('hero-email').href = 'mailto:' + p.socials.email;
    document.getElementById('social-github').href = p.socials.github;
    document.getElementById('social-linkedin').href = p.socials.linkedin;
    document.getElementById('social-email').href = 'mailto:' + p.socials.email;
    document.getElementById('about-paragraphs').innerHTML = p.aboutParagraphs.map(t => `<p style="font-size:16px; line-height:1.7; color:var(--color-text-soft); margin:0 0 16px;">${t}</p>`).join('');
    document.getElementById('skills-list').innerHTML = p.skills.map(s => `<span class="chip-outline">${s}</span>`).join('');
    document.getElementById('contact-headline').textContent = p.contactHeadline;
    document.getElementById('contact-sub').textContent = p.contactSub;
    document.getElementById('contact-email').href = 'mailto:' + p.socials.email;
    document.getElementById('contact-github').href = p.socials.github;
    document.getElementById('contact-linkedin').href = p.socials.linkedin;

    document.getElementById('project-list').innerHTML = CONTENT.projects.slice(0, 3).map(renderProjectRow).join('');
    document.getElementById('post-list').innerHTML = CONTENT.posts.slice(0, 3).map(renderPostRow).join('');
  </script>
</body>
</html>
