<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project — Kenneth Imade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="nav" style="max-width:760px;">
    <a href="index.html" class="nav-name">Kenneth Imade</a>
    <a href="work.html" style="font-family:var(--font-mono); font-size:12.5px; color:var(--color-text-softer); display:flex; align-items:center; gap:6px;">&larr; back to work</a>
  </nav>

  <div id="content"></div>

  <script src="content.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const slug = params.get('slug');
    const project = CONTENT.projects.find(p => p.slug === slug && p.caseStudy);
    const root = document.getElementById('content');

    if (!project) {
      root.innerHTML = `
        <div style="max-width:680px; margin:0 auto; padding:80px 24px; text-align:center;">
          <h1 style="font-family:var(--font-display); font-size:28px;">Project not found</h1>
          <p style="color:var(--color-text-soft);">This case study doesn't exist yet.</p>
          <a href="work.html" class="btn btn-dark" style="margin-top:16px;">Back to work</a>
        </div>`;
    } else {
      const cs = project.caseStudy;
      root.innerHTML = `
        <header class="rise" style="max-width:760px; margin:0 auto; padding:60px 24px 40px;">
          <div style="font-family:var(--font-mono); font-size:12px; color:var(--color-accent); margin-bottom:16px; text-transform:uppercase; letter-spacing:0.05em;">Case study &middot; ${project.year}</div>
          <h1 style="font-family:var(--font-display); font-weight:600; font-size:44px; line-height:1.12; letter-spacing:-0.02em; margin:0 0 22px;">${cs.headline || project.title}</h1>
          <p style="font-size:18px; line-height:1.6; color:var(--color-text-soft); margin:0 0 30px; max-width:620px;">${cs.subhead || project.blurb}</p>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            ${project.tags.map(t => `<span class="chip">${t}</span>`).join('')}
          </div>
        </header>

        <div style="max-width:760px; margin:0 auto; padding:30px 24px; border-top:1px solid var(--color-border); border-bottom:1px solid var(--color-border); display:grid; grid-template-columns:repeat(${cs.stats.length},1fr); gap:24px;">
          ${cs.stats.map(s => `
            <div>
              <div style="font-family:var(--font-display); font-size:26px; font-weight:600; letter-spacing:-0.01em;">${s.value}</div>
              <div style="font-size:13px; color:var(--color-text-softer); margin-top:4px;">${s.label}</div>
            </div>`).join('')}
        </div>

        <article style="max-width:var(--article-width); margin:0 auto; padding:50px 24px 30px;">
          ${cs.sections.map(sec => `
            <section style="margin-bottom:44px;">
              <h2 style="font-family:var(--font-display); font-size:22px; font-weight:600; margin:0 0 16px; letter-spacing:-0.01em;">${sec.heading}</h2>
              ${sec.paragraphs.map(p => `<p style="font-size:16px; line-height:1.75; color:var(--color-text-soft); margin:0 0 16px;">${p}</p>`).join('')}
            </section>`).join('')}
        </article>

        <footer style="max-width:var(--article-width); margin:0 auto; padding:50px 24px 70px; border-top:1px solid var(--color-border); margin-top:20px;">
          <a href="work.html" class="btn btn-dark">&larr; Back to all work</a>
        </footer>`;
      document.title = project.title + ' — Kenneth Imade';
    }
  </script>
</body>
</html>
